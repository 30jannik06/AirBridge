[package]
name = "airbridge"
version = "0.3.0"
edition = "2024"
description = "Lean AirPlay screen-mirroring receiver for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/30jannik06/AirBridge"
readme = "README.md"
keywords = ["airplay", "screen-mirroring", "windows", "ios", "receiver"]
categories = ["multimedia::video", "network-programming"]
publish = false

[features]
# `audio`: playback via cpal and ALAC (AirPlay music), all permissively licensed, on by default.
# `nonfree-audio`: adds AAC-ELD via FDK-AAC (sound while screen mirroring). OFF by default, and the prebuilt releases are built without it:
# the FDK-AAC license is not compatible with the GPL when distributing binaries. Build it yourself for your own
# use with `--features nonfree-audio`, and do not redistribute that binary. See THIRD_PARTY_NOTICES.md.
default = ["audio"]
audio = ["dep:cpal", "dep:cbc", "dep:alac"]
nonfree-audio = ["audio", "dep:fdk-aac"]

[dependencies]
aes = "0.9.3"
alac = { version = "0.5.0", default-features = false, optional = true }
anyhow = "1.0.104"
cbc = { version = "0.2.1", optional = true }
cpal = { version = "0.18.2", optional = true }
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
fdk-aac = { version = "0.8.0", optional = true }
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.21.6"
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tray-icon = { version = "0.26.1", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
x25519-dalek = "3.0.0"

[build-dependencies]
cc = "1.9.0"

[profile.release]
lto = true         # smaller and faster binary
codegen-units = 1
strip = true
panic = "unwind"   # the panic hook shows a dialog, so keep unwinding
